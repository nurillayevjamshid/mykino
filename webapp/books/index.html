  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Telegram safe-area & platform detection with vertical swipe disabled for smooth scrolling -->
  <script>
    try {
      var ua = navigator.userAgent || "";
      var tgApp = window.Telegram && window.Telegram.WebApp;
      var tgPlat = (tgApp && tgApp.platform) || "";
      if (tgPlat === "android" || (/Android/i.test(ua) && !/iPhone|iPad|iPod/i.test(ua))) {
        document.documentElement.classList.add("is-android");
      }

      var applyTgInsets = function() {
        if (!tgApp) return;
        var isFs = Boolean(tgApp.isFullscreen);
        var cTop = Number(tgApp.contentSafeAreaInset && tgApp.contentSafeAreaInset.top) || 0;
        var sTop = Number(tgApp.safeAreaInset && tgApp.safeAreaInset.top) || 0;
        var effTop = cTop;
        if (!effTop && isFs) {
          effTop = sTop ? (sTop + 48) : 98;
        } else if (!effTop && sTop) {
          effTop = sTop + (isFs ? 48 : 0);
        }
        if (effTop > 0) {
          document.documentElement.style.setProperty("--tg-content-safe-area-inset-top", effTop + "px");
          document.documentElement.style.setProperty("--app-safe-top", effTop + "px");
          document.documentElement.classList.add("has-tg-fullscreen");
        } else {
          document.documentElement.style.removeProperty("--tg-content-safe-area-inset-top");
          document.documentElement.style.removeProperty("--app-safe-top");
          document.documentElement.classList.remove("has-tg-fullscreen");
        }
      };

      if (tgApp) {
        try { tgApp.ready(); } catch (_) {}
        try { tgApp.expand(); } catch (_) {}
        if (typeof tgApp.disableVerticalSwipes === "function") {
          try { tgApp.disableVerticalSwipes(); } catch (_) {}
        }
        if (typeof tgApp.requestFullscreen === "function" && !tgApp.isFullscreen) {
          try { tgApp.requestFullscreen(); } catch (_) {}
        }
        applyTgInsets();

        if (tgApp.onEvent) {
          tgApp.onEvent("safeAreaChanged", applyTgInsets);
          tgApp.onEvent("contentSafeAreaChanged", applyTgInsets);
          tgApp.onEvent("fullscreenChanged", function() {
            applyTgInsets();
            if (tgApp.isFullscreen) {
              document.documentElement.classList.add("is-tg-fullscreen");
            } else {
              document.documentElement.classList.remove("is-tg-fullscreen");
            }
          });
        }
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/static/glass-theme.css?v=20261019-instant-click-v1" />
  <link rel="stylesheet" href="/books/books.css?v=20261019-v5" />
</head>

<body>

  <div class="books-app">

      <div class="brand brand--center brand--section books-brand" aria-label="NTV Audio kitoblar">

        </span>

      <div class="topbar-actions">

          </svg>

        </button>

        <!-- Search button added AFTER the saved icon -->
        <button type="button" class="topbar-btn topbar-search-btn" id="booksSearchToggleBtn" aria-label="Qidirish" title="Qidirish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Box (Toggled via search button in topbar) -->
    <div class="books-search-wrap" id="booksSearchWrap" hidden>
      <div class="search-box">

          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

        <input type="search" id="booksSearchInput" class="search-input" placeholder="Audio kitob yoki muallif qidirish..." autocomplete="off" />
        <button type="button" class="search-clear-btn" id="booksSearchClearBtn" aria-label="Tozalash" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter Chips / Genre Pills -->
    <div class="genre-pills" role="tablist">
      <button type="button" class="genre-pill is-active" data-filter="barchasi" role="tab">Barchasi</button>
      <button type="button" class="genre-pill" data-filter="Hikoya" role="tab">Hikoyalar</button>
      <button type="button" class="genre-pill" data-filter="Roman" role="tab">Romanlar</button>
      <button type="button" class="genre-pill" data-filter="Qissa" role="tab">Qissalar</button>
      <button type="button" class="genre-pill" data-filter="Drama" role="tab">Dramalar</button>
      <button type="button" class="genre-pill" data-filter="saqlanganlar" role="tab">Saqlanganlar</button>
    </div>

    <!-- Section Meta Bar -->
    <div class="section-meta-bar">
      <span class="section-label" id="sectionLabel">Kanal bo'yicha so'nggi qo'shilganlar</span>
      <span class="section-count" id="sectionCount">Yuklanmoqda...</span>
    </div>

    <!-- Audiobook List (Image 1 / Spotify Chart style: #1..#N) -->
    <main class="books-list" id="booksList" aria-label="Audio kitoblar ro'yxati">
      <!-- Injected by books.js -->
    </main>

  <aside class="sidebar" id="booksSidebar" aria-label="Asosiy menyu" aria-hidden="true">

            <circle cx="16" cy="16" r="14.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
            <path d="M13 11.4 22.2 16 13 20.6Z" fill="currentColor"></path>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-text__top">NTV</span>
        </span>
      </div>
      <button class="sidebar__close" type="button" id="sidebarCloseBtn" aria-label="Yopish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>

    </div>

    <nav class="sidebar__nav">

          <path d="M13 11.4 22.2 16 13 20.6Z" fill="currentColor"></path>

      <a class="sidebar__item sidebar__item--top sidebar__item--fifa" href="/?section=football">

      <a class="sidebar__item sidebar__item--top" href="/?section=music">

          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>

      </a>

          <path d="M5 10v2a7 7 0 0 0 14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
        <span>Potkastlar</span>
      </a>

      <a class="sidebar__item sidebar__item--top" href="/news">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
          <path d="M18 14h-8"></path>
          <path d="M15 18h-5"></path>

        </svg>
        <span>Yangiliklar</span>
      </a>

      <!-- Active Audio Kitoblar Section -->

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
        <span>Audio kitoblar</span>
      </a>

      <div class="sidebar__divider"></div>

      <!-- Quick Saqlanganlar filter in books view -->
      <button class="sidebar__item" type="button" id="sidebarSavedBooksBtn" data-sidebar-action="saved-books">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
        </svg>
        <span>Saqlangan audio kitoblar</span>
        <span class="sidebar-badge" id="sidebarSavedBadge">0</span>
      </button>

      <a class="sidebar__item" href="/?favorites=1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
        </svg>
        <span>Sevimlilar</span>
      </a>

      <a class="sidebar__item" href="/?profile=1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21a8 8 0 0 1 16 0"></path>
        </svg>
        <span>Profil</span>
      </a>
    </nav>

    <div class="sidebar__divider"></div>
    <div class="sidebar__section-title">Sozlamalar</div>
    <div class="sidebar__settings">
      <div class="sidebar-setting">
        <div class="sidebar-setting__head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>Tungi rejim</span>
        </div>
        <button class="theme-switch" type="button" id="sidebarThemeSwitch" role="switch" aria-checked="true" aria-label="Tungi rejim">
          <span class="theme-switch__track">
            <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span class="theme-switch__knob"></span>
          </span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Complete In-App Audiobook Player Modal (Bottom Sheet) -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="book-modal" id="bookModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-grabber"></div>

    <div class="modal-header">
      <span class="modal-badge-label">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
        <span>Audio kitob</span>
      </span>
      <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Yopish">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Big Square Cover Art -->
      <div class="modal-cover-wrap" id="modalCoverWrap">
        <img class="modal-cover-image" id="modalCoverImg" src="" alt="Muqova" hidden />
        <div class="modal-cover-fallback" id="modalCoverFallback">📖</div>
      </div>

      <h2 class="modal-book-title" id="modalTitle">Nomi</h2>
      <div class="modal-book-author" id="modalAuthor">Muallif</div>

      <!-- 4 Metadata Chips: Janr, O'qigan inson, Hajmi, Vaqti -->
      <div class="modal-meta-grid">
        <div class="meta-chip">
          <div class="meta-chip-label">Janr</div>
          <div class="meta-chip-value" id="modalGenre">Hikoya</div>
        </div>
        <div class="meta-chip">
          <div class="meta-chip-label">O'qigan inson</div>
          <div class="meta-chip-value" id="modalNarrator">Olamgir Abdiyev</div>
        </div>
        <div class="meta-chip">
          <div class="meta-chip-label">Hajmi</div>
          <div class="meta-chip-value" id="modalSize">13 MB</div>
        </div>
        <div class="meta-chip">
          <div class="meta-chip-label">Vaqti</div>
          <div class="meta-chip-value" id="modalDuration">14 daqiqa</div>
        </div>
      </div>

      <!-- Complete In-App Player Scrubber & Time -->
      <div class="modal-player-box">
        <div class="player-scrubber-wrap">
          <input type="range" class="scrubber-slider" id="playerScrubber" min="0" max="100" value="0" step="0.1" aria-label="Ijro joyi" />
          <div class="player-time-row">
            <span id="playerCurrentTime">0:00</span>
            <span id="playerDurationTime">14:00</span>
          </div>
        </div>

        <!-- In-App Playback Controls -->
        <div class="player-controls-row">
          <button type="button" class="btn-ctrl" id="btnPrevBook" title="Oldingi kitob" aria-label="Oldingi">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <button type="button" class="btn-ctrl" id="btnRewind" title="-15 sekund" aria-label="Orqaga 15 sekund">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"></path>
            </svg>
            <span class="ctrl-subtext">15</span>
          </button>

          <!-- Big In-App Play / Pause Button -->
          <button type="button" class="btn-ctrl btn-ctrl-main" id="modalPlayBtn" title="Ijro / To'xtatish" aria-label="Ijro">
            <svg class="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" hidden>
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </button>

          <button type="button" class="btn-ctrl" id="btnForward" title="+15 sekund" aria-label="Oldinga 15 sekund">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 17l5-5-5-5M6 17l5-5-5-5"></path>
            </svg>
            <span class="ctrl-subtext">15</span>
          </button>

          <button type="button" class="btn-ctrl" id="btnNextBook" title="Keyingi kitob" aria-label="Keyingi">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>

        <!-- Secondary Controls: Speed & Watermark/Bookmark -->
        <div class="player-secondary-row">
          <button type="button" class="btn-speed-toggle" id="btnSpeedToggle" title="Ijro tezligi">
            <span id="speedLabel">1.0x</span>
          </button>

          <button type="button" class="btn-modal-bookmark" id="modalBookmarkBtn" aria-label="Saqlash" title="Saqlash">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
            </svg>
            <span class="bookmark-text" id="modalBookmarkText">Saqlash</span>
          </button>
        </div>
      </div>

      <!-- Description Excerpt from Channel Post -->
      <div class="modal-desc-box" id="modalDescBox" hidden>
        <p class="modal-desc-text" id="modalDescText"></p>
      </div>
    </div>
  </div>

  <!-- Sticky Bottom In-App Mini Player -->
  <div class="mini-player-bar" id="miniPlayer" role="region" aria-label="Mini pleyer">
    <!-- Progress Line along top of mini-player -->
    <div class="mini-progress-track">
      <div class="mini-progress-bar" id="miniProgressBar"></div>
    </div>

    <div class="mini-cover" id="miniCover">📖</div>
    <div class="mini-info" id="miniInfoWrap">
      <div class="mini-title" id="miniTitle">Audio kitob</div>
      <div class="mini-author" id="miniAuthor">Muallif</div>
    </div>

    <div class="mini-controls">
      <!-- Toggle Play/Pause directly in mini app -->
      <button type="button" class="mini-play-btn" id="miniPlayBtn" aria-label="Ijro / Pauza">
        <svg class="mini-icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
        <svg class="mini-icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden>
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      </button>
    </div>
  </div>

  <!-- Hidden In-App HTML5 Audio Element for lock screen / background anchor -->
  <audio id="inAppAudio" preload="auto" playsinline webkit-playsinline></audio>

  <!-- Background YouTube IFrame Player Container for Real Audiobook Audio -->
  <div id="ytBooksPlayer" style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0.001;pointer-events:none;"></div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/books/books.js?v=20261019-v5"></script>
</body>

</html>
