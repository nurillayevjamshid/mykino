    })();
  </script>

  <!-- Telegram safe-area & platform detection with vertical swipe disabled for smooth scrolling -->
  <script>
    try {
      var ua = navigator.userAgent || "";
      var tgApp = window.Telegram && window.Telegram.WebApp;
      var tgPlat = (tgApp && tgApp.platform) || "";
      if (tgPlat === "android" || (/Android/i.test(ua) && !/iPhone|iPad|iPod/i.test(ua))) {
        document.documentElement.classList.add("is-android");
      }

      var applyTgInsets = function() {
        if (!tgApp) return;
        var isFs = Boolean(tgApp.isFullscreen);
        var cTop = Number(tgApp.contentSafeAreaInset && tgApp.contentSafeAreaInset.top) || 0;
        var sTop = Number(tgApp.safeAreaInset && tgApp.safeAreaInset.top) || 0;
        var effTop = cTop;
        if (!effTop && isFs) {
          effTop = sTop ? (sTop + 48) : 98;
        } else if (!effTop && sTop) {
          effTop = sTop + (isFs ? 48 : 0);
        }
        if (effTop > 0) {
          document.documentElement.style.setProperty("--tg-content-safe-area-inset-top", effTop + "px");
          document.documentElement.style.setProperty("--app-safe-top", effTop + "px");
          document.documentElement.classList.add("has-tg-fullscreen");
        } else {
          document.documentElement.style.removeProperty("--tg-content-safe-area-inset-top");
          document.documentElement.style.removeProperty("--app-safe-top");
          document.documentElement.classList.remove("has-tg-fullscreen");
        }
      };

      if (tgApp) {
        try { tgApp.ready(); } catch (_) {}
        try { tgApp.expand(); } catch (_) {}
        if (typeof tgApp.disableVerticalSwipes === "function") {
          try { tgApp.disableVerticalSwipes(); } catch (_) {}
        }
        if (typeof tgApp.requestFullscreen === "function" && !tgApp.isFullscreen) {
          try { tgApp.requestFullscreen(); } catch (_) {}
        }
        applyTgInsets();

        if (tgApp.onEvent) {
          tgApp.onEvent("safeAreaChanged", applyTgInsets);
          tgApp.onEvent("contentSafeAreaChanged", applyTgInsets);
          tgApp.onEvent("fullscreenChanged", function() {
            applyTgInsets();
            if (tgApp.isFullscreen) {
              document.documentElement.classList.add("is-tg-fullscreen");
            } else {
              document.documentElement.classList.remove("is-tg-fullscreen");
            }
          });
        }
      }
    } catch (_) {}
  </script>

          </button>

          <button type="button" class="btn-modal-bookmark" id="modalBookmarkBtn" aria-label="Saqlash" title="Saqlash">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 7v14l-6-4-6 4V7a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4z"></path>
            </svg>
            <span class="bookmark-text" id="modalBookmarkText">Saqlash</span>
          </button>

          <button type="button" class="btn-ctrl btn-ctrl-secondary" id="btnForward" title="+15 sekund" aria-label="Oldinga 15 sekund">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 17l5-5-5-5M6 17l5-5-5-5"></path>
            </svg>
            <span class="ctrl-subtext">15</span>
          </button>
        </div>
      </div>

      <!-- 4 Metadata Chips: Janr, O'qigan inson, Hajmi, Vaqti -->
      <div class="modal-meta-grid">
        <div class="meta-chip">
          <div class="meta-chip-label">Janr</div>
          <div class="meta-chip-value" id="modalGenre">Hikoya</div>
        </div>
        <div class="meta-chip">
          <div class="meta-chip-label">O'qigan inson</div>
          <div class="meta-chip-value" id="modalNarrator">Olamgir Abdiyev</div>
        </div>
        <div class="meta-chip">
          <div class="meta-chip-label">Hajmi</div>
          <div class="meta-chip-value" id="modalSize">13 MB</div>
        </div>
        <div class="meta-chip">
          <div class="meta-chip-label">Vaqti</div>
          <div class="meta-chip-value" id="modalDuration">14 daqiqa</div>
        </div>
      </div>

      <!-- Description Excerpt from Channel Post -->
      <div class="modal-desc-box" id="modalDescBox" hidden>
        <p class="modal-desc-text" id="modalDescText"></p>
      </div>
    </div>
  </div>

  <!-- Sticky Bottom In-App Mini Player -->
  <div class="mini-player-bar" id="miniPlayer" role="region" aria-label="Mini pleyer">
    <!-- Progress Line along top of mini-player -->
    <div class="mini-progress-track">
      <div class="mini-progress-bar" id="miniProgressBar"></div>
    </div>

    <div class="mini-cover" id="miniCover">📖</div>
    <div class="mini-info" id="miniInfoWrap">
      <div class="mini-title" id="miniTitle">Audio kitob</div>
      <div class="mini-author" id="miniAuthor">Muallif</div>
    </div>

    <div class="mini-controls">
      <!-- Toggle Play/Pause directly in mini app -->
      <button type="button" class="mini-play-btn" id="miniPlayBtn" aria-label="Ijro / Pauza">
        <svg class="mini-icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
        <svg class="mini-icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" hidden>
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      </button>
    </div>
  </div>

  <!-- Hidden In-App HTML5 Audio Element for lock screen / background anchor -->
  <audio id="inAppAudio" preload="auto" playsinline webkit-playsinline></audio>

  <!-- Background YouTube IFrame Player Container for Real Audiobook Audio -->
  <div id="ytBooksPlayer" style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0.001;pointer-events:none;"></div>

  <!-- Section Switch Splash Screen (Sidebar navigation) -->
  <div id="sectionSplash" class="section-splash" hidden aria-hidden="true">
    <div class="section-splash__spinner" id="sectionSplashSpinner" aria-hidden="true"></div>
    <div class="section-splash__brand">
      <span class="section-splash__logo" id="sectionSplashLogo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
      </span>
      <span class="section-splash__name">
        <span>NTV</span>
      </span>
    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/books/books.js?v=20261031-smooth-scroll-v1"></script>
</body>

</html>
