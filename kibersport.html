<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="var(--tg-theme-bg-color)">
  <title>NTV — Kibersport</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /*
      NTV Kibersport — Telegram Mini App uchun yagona fayl.
      Ranglar to'g'ridan-to'g'ri Telegram tema o'zgaruvchilaridan olinadi.
      Fallback qiymatlar sahifani Telegramdan tashqari oddiy brauzerda ham ko'rish uchun qo'yilgan.
    */
    :root {
      --tg-theme-bg-color: #f2f2f7;
      --tg-theme-secondary-bg-color: #ffffff;
      --tg-theme-section-bg-color: #ffffff;
      --tg-theme-section-header-text-color: #6d6d72;
      --tg-theme-section-separator-color: #e5e5ea;
      --tg-theme-text-color: #1c1c1e;
      --tg-theme-hint-color: #8e8e93;
      --tg-theme-link-color: #2481cc;
      --tg-theme-button-color: #2481cc;
      --tg-theme-button-text-color: #ffffff;
      --tg-theme-destructive-text-color: #ff3b30;
      --tg-theme-subtitle-text-color: #8e8e93;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      color-scheme: light dark;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }

    button, a, iframe { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--tg-theme-link-color); outline-offset: 3px; }

    .app-shell { width: min(100%, 720px); margin: 0 auto; }
    .page { padding: 16px 16px 12px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      margin-bottom: 16px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 3px;
      color: var(--tg-theme-section-header-text-color);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(26px, 7vw, 34px); line-height: 1.08; letter-spacing: -.035em; }
    h2 { font-size: 18px; line-height: 1.2; letter-spacing: -.02em; }

    .header-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }

    .header-mark svg { width: 24px; height: 24px; }

    .tabs-wrap { margin: 0 -16px 18px; overflow: hidden; }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 16px 5px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      min-height: 38px;
      padding: 0 15px;
      border: 1px solid var(--tg-theme-section-separator-color);
      border-radius: 999px;
      background: var(--tg-theme-secondary-bg-color);
      color: var(--tg-theme-text-color);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      scroll-snap-align: start;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
    }
    .tab:active { transform: scale(.97); }
    .tab[aria-selected="true"] {
      border-color: var(--tg-theme-button-color);
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 10px;
    }
    .section-label span { color: var(--tg-theme-hint-color); font-size: 12px; }

    .stream-card {
      overflow: hidden;
      border: 1px solid var(--tg-theme-section-separator-color);
      border-radius: 18px;
      background: var(--tg-theme-section-bg-color);
      box-shadow: 0 5px 20px color-mix(in srgb, var(--tg-theme-text-color) 8%, transparent);
    }

    .stream-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--tg-theme-secondary-bg-color);
    }

    .stream-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    .stream-controls { position:absolute; z-index:4; right:10px; bottom:10px; left:10px; display:flex; align-items:center; justify-content:flex-end; gap:7px; pointer-events:none; }
    .stream-control { display:grid; width:36px; height:36px; place-items:center; padding:0; border:1px solid rgba(255,255,255,.28); border-radius:9px; background:rgba(0,0,0,.72); color:#fff; cursor:pointer; pointer-events:auto; }
    .stream-control svg { width:19px; height:19px; }
    .stream-control--play { margin-right:auto; border-radius:50%; }
    .stream-quality, .stream-speed { height:36px; padding:0 7px; border:1px solid rgba(255,255,255,.28); border-radius:9px; background:rgba(0,0,0,.72); color:#fff; font:600 11px inherit; cursor:pointer; pointer-events:auto; }

    .live-badge {
      position: absolute;
      z-index: 2;
      top: 11px;
      left: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--tg-theme-destructive-text-color);
      color: var(--tg-theme-button-text-color);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
    }
    .live-badge::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      content: "";
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .stream-info { padding: 14px; }
    .stream-info__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .stream-title { font-size: 16px; font-weight: 750; line-height: 1.25; }
    .stream-meta { margin-top: 5px; color: var(--tg-theme-hint-color); font-size: 12px; line-height: 1.35; }
    .viewer-count {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-section-header-text-color);
      font-size: 11px;
      white-space: nowrap;
    }

    .highlight-list { display: grid; gap: 9px; }
    .highlight-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--tg-theme-section-separator-color);
      border-radius: 15px;
      background: var(--tg-theme-section-bg-color);
      text-align: left;
      cursor: pointer;
      transition: transform .18s ease, background-color .18s ease;
    }
    .highlight-card:active { transform: scale(.985); background: var(--tg-theme-bg-color); }
    .highlight-thumb {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
    }
    .highlight-thumb svg { width: 23px; height: 23px; }
    .highlight-copy { min-width: 0; flex: 1; }
    .highlight-title { overflow: hidden; font-size: 14px; font-weight: 700; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
    .highlight-subtitle { margin-top: 4px; color: var(--tg-theme-hint-color); font-size: 12px; line-height: 1.25; }
    .highlight-arrow { width: 18px; height: 18px; color: var(--tg-theme-hint-color); flex: 0 0 auto; }

    .empty-state {
      padding: 24px 14px;
      border: 1px dashed var(--tg-theme-section-separator-color);
      border-radius: 15px;
      color: var(--tg-theme-hint-color);
      text-align: center;
    }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--tg-theme-text-color); }
    .empty-state p { font-size: 12px; line-height: 1.4; }

    .bottom-nav {
      position: fixed;
      z-index: 20;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--tg-theme-section-separator-color);
      background: color-mix(in srgb, var(--tg-theme-secondary-bg-color) 92%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .bottom-nav__inner { display: grid; grid-template-columns: repeat(5, 1fr); width: min(100%, 720px); margin: 0 auto; gap: 2px; }
    .nav-item {
      display: flex;
      min-width: 0;
      min-height: 51px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: var(--tg-theme-hint-color);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      transition: background-color .18s ease, color .18s ease, transform .18s ease;
    }
    .nav-item svg { width: 21px; height: 21px; }
    .nav-item span { overflow: hidden; max-width: 100%; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item[aria-current="page"] { background: var(--tg-theme-bg-color); color: var(--tg-theme-button-color); }
    .nav-item:active { transform: scale(.95); }

    .toast {
      position: fixed;
      z-index: 30;
      right: 16px;
      bottom: calc(88px + env(safe-area-inset-bottom));
      left: 16px;
      display: none;
      padding: 12px 14px;
      border-radius: 13px;
      background: var(--tg-theme-text-color);
      color: var(--tg-theme-bg-color);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }
    .toast.is-visible { display: block; animation: toast-in .2s ease-out; }
    @keyframes toast-in { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media (min-width: 600px) {
      .page { padding: 24px 22px 18px; }
      .tabs-wrap { margin-right: -22px; margin-left: -22px; }
      .tabs { padding-right: 22px; padding-left: 22px; }
      .highlight-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell" aria-label="NTV Kibersport bo'limi">
    <div class="page">
      <header class="topbar">
        <div>
          <span class="eyebrow">NTV Arena</span>
          <h1>Kibersport</h1>
        </div>
        <div class="header-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 7.5h7l1.4 2.2 2.1-1.1 1.3 6.6a2 2 0 0 1-3.5 1.5l-2.3-2.7h-5l-2.3 2.7a2 2 0 0 1-3.5-1.5L5 8.6l2.1 1.1L8.5 7.5Z" />
            <path d="M8.5 11.5v3M7 13h3M15.8 12.5h.1M18 14h.1" />
          </svg>
        </div>
      </header>

      <div class="tabs-wrap" aria-label="Kibersport yo'nalishlari">
        <div class="tabs" id="gameTabs" role="tablist"></div>
      </div>

      <section aria-labelledby="liveHeading">
        <div class="section-label">
          <h2 id="liveHeading">Jonli strim</h2>
          <span id="activeGameLabel">PUBG Mobile</span>
        </div>

        <article class="stream-card">
          <div class="stream-frame">
            <span class="live-badge">LIVE</span>
            <iframe id="streamFrame" title="Kibersport jonli strimi" src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?controls=0&enablejsapi=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share" allowfullscreen></iframe>
            <div class="stream-controls" aria-label="Video boshqaruvlari">
              <button class="stream-control stream-control--play" id="streamPlayButton" type="button" aria-label="Play" title="Play"><svg id="streamPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 12 7-12 7V5Z"/></svg></button>
              <select class="stream-quality" id="streamQuality" aria-label="Video sifati" title="Video sifati"><option value="default">Auto</option><option value="hd1080">1080p</option><option value="hd720">720p</option><option value="large">480p</option><option value="medium">360p</option></select>
              <select class="stream-speed" id="streamSpeed" aria-label="Video tezligi" title="Video tezligi"><option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2x</option></select>
              <button class="stream-control" id="streamFullscreenButton" type="button" aria-label="To‘liq ekran" title="To‘liq ekran"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
            </div>
          </div>
          <div class="stream-info">
            <div class="stream-info__top">
              <div>
                <h3 class="stream-title" id="streamTitle">PUBG Mobile — NTV Arena</h3>
                <p class="stream-meta" id="streamMeta">Bugun, 20:00 · Grand Final</p>
              </div>
              <span class="viewer-count" id="viewerCount">Jonli</span>
            </div>
          </div>
        </article>
      </section>

      <section aria-labelledby="highlightsHeading">
        <div class="section-label">
          <h2 id="highlightsHeading">So‘nggi haylaytlar</h2>
          <span id="highlightCount">3 ta</span>
        </div>
        <div class="highlight-list" id="highlightList"></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
    <div class="bottom-nav__inner">
      <button class="nav-item" type="button" data-nav="kino" aria-label="Kino">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m8 4 2 4M14 4l2 4M8 20l2-4M14 20l2-4"/><path d="M3 9h18M3 15h18"/></svg>
        <span>Kino</span>
      </button>
      <button class="nav-item" type="button" data-nav="music" aria-label="Musiqa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        <span>Musiqa</span>
      </button>
      <button class="nav-item" type="button" data-nav="podcast" aria-label="Podkast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M9 10a3 3 0 0 1 6 0v2a3 3 0 0 1-6 0v-2ZM4 11v1a8 8 0 0 0 16 0v-1M12 20v2"/></svg>
        <span>Podkast</span>
      </button>
      <button class="nav-item" type="button" data-nav="football" aria-label="Futbol">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 3 2v3.5l-3 2-3-2V9l3-2ZM9 9 6 8M15 9l3-1M9 14.5l-1 3M15 14.5l1 3M12 14.5V19"/></svg>
        <span>Futbol</span>
      </button>
      <button class="nav-item" type="button" data-nav="esports" aria-label="Kibersport" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5h7l1.4 2.2 2.1-1.1 1.3 6.6a2 2 0 0 1-3.5 1.5l-2.3-2.7h-5l-2.3 2.7a2 2 0 0 1-3.5-1.5L5 8.6l2.1 1.1L8.5 7.5Z"/><path d="M8.5 11.5v3M7 13h3M15.8 12.5h.1M18 14h.1"/></svg>
        <span>Kibersport</span>
      </button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Telegram Web App SDK mavjud bo'lsa, Mini App'ni ekran balandligiga yoyamiz.
    const telegram = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (telegram) {
      telegram.ready();
      telegram.expand();
    }

    const games = {
      pubg: {
        label: 'PUBG Mobile',
        streamTitle: 'PUBG Mobile — NTV Arena',
        streamMeta: 'Bugun, 20:00 · Grand Final',
        viewers: 'Jonli',
        streamUrl: 'https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?rel=0',
        highlights: [
          { title: 'Grand Final oldidan so‘nggi tayyorgarlik', subtitle: 'Bugun · 12 daqiqa', icon: 'target' },
          { title: 'Eng yaxshi clutch momentlar', subtitle: 'Kecha · 08 daqiqa', icon: 'play' },
          { title: 'Jamoalar bilan qisqa intervyu', subtitle: '2 kun oldin · 05 daqiqa', icon: 'mic' }
        ]
      },
      cs2: {
        label: 'CS2',
        streamTitle: 'CS2 — NTV Arena',
        streamMeta: 'Ertaga, 19:30 · Playoff',
        viewers: 'Jadval',
        streamUrl: 'https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?rel=0',
        highlights: [
          { title: 'Playoff bracket e’lon qilindi', subtitle: 'Bugun · 04 daqiqa', icon: 'trophy' },
          { title: 'Haftaning eng yaxshi deagle roundi', subtitle: 'Kecha · 07 daqiqa', icon: 'play' },
          { title: 'Map veto: jamoalar tanlovi', subtitle: '3 kun oldin · 06 daqiqa', icon: 'map' }
        ]
      },
      coc: {
        label: 'Clash of Clans',
        streamTitle: 'Clash of Clans — NTV Arena',
        streamMeta: 'Shanba, 18:00 · Clan War League',
        viewers: 'Jadval',
        streamUrl: 'https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?rel=0',
        highlights: [
          { title: 'Clan War League: asosiy janglar', subtitle: 'Shanba · 11 daqiqa', icon: 'shield' },
          { title: '3 yulduzli hujumlar to‘plami', subtitle: 'Kecha · 09 daqiqa', icon: 'play' },
          { title: 'Turnir oldidan strategiyalar', subtitle: '4 kun oldin · 10 daqiqa', icon: 'spark' }
        ]
      }
    };

    const icons = {
      play: '<path d="m9 6 8 6-8 6V6Z" fill="currentColor" stroke="none"/>',
      target: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
      mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/>',
      trophy: '<path d="M8 4h8v4a4 4 0 0 1-8 0V4ZM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 12v5M8 21h8M9 17h6"/>',
      map: '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15M15 6v15"/>',
      shield: '<path d="M12 3 19 6v5c0 4.4-2.9 8.3-7 10-4.1-1.7-7-5.6-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/>',
      spark: '<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3ZM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>'
    };

    const tabs = document.getElementById('gameTabs');
    const streamFrame = document.getElementById('streamFrame');
    const activeGameLabel = document.getElementById('activeGameLabel');
    const streamTitle = document.getElementById('streamTitle');
    const streamMeta = document.getElementById('streamMeta');
    const viewerCount = document.getElementById('viewerCount');
    const highlightList = document.getElementById('highlightList');
    const highlightCount = document.getElementById('highlightCount');
    const toast = document.getElementById('toast');
    const streamPlayButton = document.getElementById('streamPlayButton');
    const streamPlayIcon = document.getElementById('streamPlayIcon');
    const streamQuality = document.getElementById('streamQuality');
    const streamSpeed = document.getElementById('streamSpeed');
    const streamFullscreenButton = document.getElementById('streamFullscreenButton');
    let toastTimer;
    document.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', (event) => event.preventDefault(), { passive: false });
    document.addEventListener('gestureend', (event) => event.preventDefault(), { passive: false });
    document.addEventListener('wheel', (event) => { if (event.ctrlKey) event.preventDefault(); }, { passive: false });
    let streamPlaying = false;
    function sendStreamCommand(func, args = []) {
      streamFrame.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
    }
    function setStreamPlaying(playing) {
      streamPlaying = Boolean(playing);
      if (streamPlayIcon) streamPlayIcon.innerHTML = streamPlaying ? '<path d="M7 5v14M17 5v14"/>' : '<path d="m8 5 12 7-12 7V5Z"/>';
    }
    streamPlayButton?.addEventListener('click', () => { sendStreamCommand(streamPlaying ? 'pauseVideo' : 'playVideo'); setStreamPlaying(!streamPlaying); });
    streamQuality?.addEventListener('change', () => sendStreamCommand('setPlaybackQuality', [streamQuality.value]));
    streamSpeed?.addEventListener('change', () => sendStreamCommand('setPlaybackRate', [Number(streamSpeed.value)]));
    streamFullscreenButton?.addEventListener('click', async () => {
      const frame = streamFrame.closest('.stream-frame');
      try { if (document.fullscreenElement) await document.exitFullscreen(); else await frame.requestFullscreen(); } catch (_) {}
    });
    window.addEventListener('message', (event) => {
      if (event.source !== streamFrame.contentWindow) return;
      try { const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; if (data?.event === 'onStateChange') setStreamPlaying(Number(data.info) === 1); } catch (_) {}
    });
    function toEmbedUrl(value) {
      try {
        const url = new URL(String(value || ''));
        if (url.hostname === 'youtu.be') return `https://www.youtube-nocookie.com/embed/${url.pathname.slice(1)}?controls=0&enablejsapi=1&rel=0&modestbranding=1`;
        if (url.hostname.endsWith('youtube.com') || url.hostname.endsWith('youtube-nocookie.com')) {
          const id = url.searchParams.get('v');
          if (id) return `https://www.youtube-nocookie.com/embed/${id}?controls=0&enablejsapi=1&rel=0&modestbranding=1`;
          if (url.pathname.startsWith('/embed/')) return `https://www.youtube-nocookie.com${url.pathname}?controls=0&enablejsapi=1&rel=0&modestbranding=1`;
          if (url.pathname.startsWith('/live/')) return `https://www.youtube-nocookie.com/embed/${url.pathname.slice(6)}?controls=0&enablejsapi=1&rel=0&modestbranding=1`;
        }
      } catch (_) {}
      return '';
    }
    async function loadConfiguredStreams() {
      try {
        const response = await fetch('/api/settings', { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        const configured = data.esportsStreams || {};
        Object.entries(configured).forEach(([key, item]) => {
          if (!games[key] || !item || item.enabled === false) return;
          const embed = toEmbedUrl(item.youtubeUrl);
          if (embed) games[key].streamUrl = embed;
          if (item.label) games[key].label = item.label;
          if (item.title) games[key].streamTitle = item.title;
          if (item.meta) games[key].streamMeta = item.meta;
        });
        selectGame(activeKey);
      } catch (_) {}
    }

    function iconSvg(name, className) {
      return `<svg class="${className || ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.play}</svg>`;
    }

    function renderTabs(activeKey) {
      tabs.innerHTML = Object.entries(games).map(([key, game]) => `
        <button class="tab" type="button" role="tab" aria-selected="${key === activeKey}" data-game="${key}">${game.label}</button>
      `).join('');
    }

    function renderHighlights(items) {
      highlightCount.textContent = `${items.length} ta`;
      highlightList.innerHTML = items.map((item) => `
        <button class="highlight-card" type="button" data-highlight="${item.title.replaceAll('"', '&quot;')}">
          <span class="highlight-thumb">${iconSvg(item.icon)}</span>
          <span class="highlight-copy">
            <strong class="highlight-title">${item.title}</strong>
            <span class="highlight-subtitle">${item.subtitle}</span>
          </span>
          <svg class="highlight-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      `).join('');
    }

    function selectGame(key) {
      const game = games[key];
      if (!game) return;
      activeKey = key;
      renderTabs(key);
      activeGameLabel.textContent = game.label;
      streamTitle.textContent = game.streamTitle;
      streamMeta.textContent = game.streamMeta;
      viewerCount.textContent = game.viewers;
      streamFrame.src = game.streamUrl;
      renderHighlights(game.highlights);
      tabs.querySelector(`[data-game="${key}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('is-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
    }

    tabs.addEventListener('click', (event) => {
      const tab = event.target.closest('[data-game]');
      if (tab) selectGame(tab.dataset.game);
    });

    highlightList.addEventListener('click', (event) => {
      const card = event.target.closest('[data-highlight]');
      if (card) showToast(`Haylayt: ${card.dataset.highlight}`);
    });

    document.querySelectorAll('[data-nav]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-nav]').forEach((item) => item.removeAttribute('aria-current'));
        button.setAttribute('aria-current', 'page');
        if (button.dataset.nav !== 'esports') {
          showToast(`${button.querySelector('span').textContent} bo‘limi NTV ilovasida ochiladi`);
        }
      });
    });

    // Telegram tema o'zgarganda CSS o'zgaruvchilari avtomatik ishlaydi.
    // Bu event faqat Telegram WebApp ranglarini ishga tushirilgandan keyin qayta qo'llash uchun kerak.
    telegram?.onEvent?.('themeChanged', () => document.documentElement.style.colorScheme = 'light dark');

    let activeKey = 'pubg';
    selectGame(activeKey);
    loadConfiguredStreams();
  </script>
</body>
</html>

     <script src="https://telegram.org/js/telegram-web-app.js"></script>
